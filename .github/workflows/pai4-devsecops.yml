
name: PAI4 - DevSecOps

# Ejecutar con cada push, pull request o manualmente
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    name: Verificar repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar archivos del proyecto
        run: |
          echo "Comprobando estructura de Juice Shop..."
          test -f package.json
          test -f Dockerfile
          echo "Repositorio preparado correctamente"
  
  # T05 - Analisis SAST con Semgrep
  semgrep:
    name: Analisis SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Semgrep
        run: |
          python -m pip install semgrep
          semgrep --version

      - name: Ejecutar analisis SAST
        run: |
          mkdir -p reports
          semgrep scan --config p/security-audit --json --output reports/semgrep-report.json --metrics=off .

      - name: Mostrar numero de hallazgos
        run: |
          python -c "import json; data=json.load(open('reports/semgrep-report.json',encoding='utf-8')); print('Hallazgos Semgrep:',len(data.get('results',[])))"

      - name: Guardar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep-report.json
          if-no-files-found: error
          retention-days: 30
  
  # T07 - Analisis DAST con OWASP ZAP
  zap:
    name: Analisis DAST - ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker de Juice Shop
        run: |
          docker build -t pai4-juice-shop:ci .

      - name: Arrancar Juice Shop
        run: |
          docker run -d \
            --name pai4-juice-shop \
            -p 127.0.0.1:3000:3000 \
            pai4-juice-shop:ci

      - name: Comprobar que Juice Shop responde
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop funcionando en localhost:3000"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Juice Shop no ha arrancado"
          docker logs pai4-juice-shop
          exit 1

      - name: Preparar directorio de informes
        run: |
          mkdir -p reports/zap
          sudo chown 1000:1000 reports/zap

      - name: Ejecutar analisis DAST con ZAP
        run: |
          set -o pipefail

          docker run --rm \
            --network host \
            -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:3000 \
            -j \
            -m 2 \
            -T 10 \
            -I \
            -J zap-report.json \
            -r zap-report.html \
            2>&1 | tee reports/zap-console.log

      - name: Comprobar informe ZAP
        run: |
          test -s reports/zap/zap-report.json
          echo "Informe JSON generado correctamente"
          jq -r \
            '[.site[]?.alerts[]?] | length' \
            reports/zap/zap-report.json

      - name: Guardar informes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Detener Juice Shop
        if: always()
        run: |
          docker logs pai4-juice-shop \
            > juice-shop-container.log 2>&1 || true
          docker rm -f pai4-juice-shop || true



